name: procurement-asset-management

services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - .:/workspace
      - maven-cache:/home/developer/.m2
    init: true

  db:
    # PostgreSQL 18.6 / Debian Bookworm; pinned multi-architecture image.
    image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    env_file:
      - .env
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  maven-cache:
  postgres-data:
